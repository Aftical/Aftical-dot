source = /home/Aftical/.cache/wal/colors-hyprland

$blue = rgba(175, 198, 255, 0.7)
$white = rgba(255, 255, 255, 0.7)
$lightblue = rgb(191, 198, 220)
background {
    monitor =
    path = ~/Pictures/Wallpapers/BG_CS_PV3_76.jpg
    # path = ~/Pictures/Wallpapers/BG_CS_Millenium_01.jpg
    blur_size = 0
    blur_passes = 0
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}
input-field {
    monitor =
    size = 250, 35
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgb(255, 255, 255)
    inner_color = rgba(255, 255, 255, 0)
    font_color = $white
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, 140
    halign = center
    valign = bottom
}
label {
    monitor =
    text = ぼっち・
    color = $blue
    font_size = 12
    font_family = JetBrains Mono Nerd Font 10
    position = -38, -90
    halign = center
    valign = top
}
label {
    monitor =
    text = ざ
    color = $blue
    font_size = 12
    font_family = JetBrains Mono Nerd Font 10
    position = 3, -90
    halign = center
    valign = top
}
label {
    monitor =
    text = ・ろっく！
    color = $blue
    font_size = 12
    font_family = JetBrains Mono Nerd Font 10
    position = 53, -90
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M:%S") </big></b>"
    color = $lightblue
    font_size = 64
    font_family = JetBrains Mono Nerd Font 10
    position = 0, 210
    halign = center
    valign = center
}
label {
    monitor =
    text = Aris is waiting for you $USER!
    color = $blue
    font_size = 20
    font_family = JetBrains Mono Nerd Font 10
    position = 0, 140
    halign = center
    valign = center
}
