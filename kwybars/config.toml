#;--- kwybars-configurations ---;#
# theme = "rose-pine"

[overlay]
monitor_mode = "primary"
layer = "background"
position = "bottom"
full_length = false
width = 400
height = 100
anchor_margin = 0
margin_left = 0
margin_right = 0
margin_top = 0
margin_bottom = 0
horizontal_alignment = "center"
vertical_alignment = "center"

[visualizer]
backend = "cava"
layout = "line"
line_mode = "continuous"
line_split_gap = 100
mirror_orientation = "horizontal"
mirror_gap = 0
wave_stroke_width = 3
wave_fill = false
wave_glow = false
wave_smoothing = 1.0
wave_motion_smoothing = 1
wave_amplitude = 0.8
frame_edges = ["top", "bottom"]
frame_mirror_mode = "pairs"
bars = 70
bar_width = 10
bar_corner_radius = 50
segmented_bars = false
segment_length = 50
segment_gap = 6
radial_inner_radius = 180
radial_start_angle = -90
radial_arc_degrees = 360
radial_rotation_speed = 0
center_offset_x = 0
center_offset_y = 0
polygon_sides = 3
polygon_radius = 220
polygon_bar_length = 0
polygon_rotation = -90
polygon_rotation_speed = 0
gap = 5
framerate = 60
color_mode = "gradient"
color_rgba = "rgba(175, 198, 255, 0.4)"
color2_rgba = "rgba(191, 198, 220, 0.4)"
theme_opacity = 1.0
pipewire_attack = 0.14
pipewire_decay = 0.975
pipewire_gain = 1.20
pipewire_curve = 0.95
pipewire_neighbor_mix = 0.24

[image_overlay]
enabled = false
path = ""
opacity = 1.0
fit = "contain"
width = 0
height = 0
offset_x = 0
offset_y = 0

[daemon]
enabled = true
poll_interval_ms = 30
activity_threshold = 0.035
activate_delay_ms = 180
deactivate_delay_ms = 2200
stop_on_silence = false
notify_on_error = true
notify_cooldown_seconds = 45
overlay_command = "kwybars-overlay"
overlay_args = []
