palette = "noctalia"
# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $directory $fill $git_branch $cmd_duration
# $character"""
format = """
$directory $cmd_duration$git_branch $time
$character"""

[fill]
symbol = '-'
style = 'fg:#eb6f92'

# Replace the "❯" symbol in the prompt with "➜"
# The name of the module we are configuring is "character" 
[character]
success_symbol = "[ ](bold fg:blue)"
error_symbol = "[ ](bold fg:red)"
# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:#ffffff"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:yellow)[$symbol $branch(:$remote_branch)](fg:#ffffff bg:yellow)[ ](bold fg:yellow)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](bg:252 bold fg:235)[](bold fg:252)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = false
# format = '🕙[\[ $time \]]($style) '
format = '[](bold fg:red)[󰪢 $time](bold bg:red fg:#ffffff)[](bold fg:red)'
time_format = "%I:%M%p"

[username]
style_user = "bold bg:252 fg:235"
style_root = "red bold"
format = "[](bold fg:252)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:blue fg:#ffffff"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:blue)[󰉋 → $path]($style)[](bold fg:blue)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:#ffffff)[󰪢 $duration](bold bg:#ffffff fg:magenta)[](bold fg:#ffffff)'




